<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GestRend</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231b7f8c'/><path d='M8 20c4-6 8 2 16-6' stroke='%23f2b705' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>try{var th=JSON.parse(localStorage.getItem('gestRend_theme'));if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
</head>
<body>

<div id="lov"><div class="spin"></div><p data-i18n="load">Conectando…</p></div>

<div id="app">
  <!-- ── Navegación ─────────────────────────────────────── -->
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" class="brand-ico" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M7 21c4-7 9 2 18-7" stroke="#f2b705" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <span>GestRend</span>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-btn" data-mod="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="mInicio"></span></button>
      <button class="nav-btn" data-mod="tareas"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span data-i18n="mTareas"></span></button>
      <button class="nav-btn" data-mod="reportes"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="mReportes"></span></button>
      <button class="nav-btn" data-mod="caja"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9v.01M18 15v.01"/></svg><span data-i18n="mCaja"></span></button>
      <button class="nav-btn" data-mod="productos"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></svg><span data-i18n="mProductos"></span></button>
      <button class="nav-btn" data-mod="calc"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15v4M8 19h.01M12 19h.01"/></svg><span data-i18n="mCalc"></span></button>
      <button class="nav-btn" data-mod="empresa"><svg viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M2 21h20M8 8h3M8 12h3M8 16h3"/></svg><span data-i18n="mEmpresa"></span></button>
    </nav>
    <div class="side-foot">
      <div class="sync-badge loading" id="sbadge"><i class="sync-dot"></i><span id="stxt"></span></div>
    </div>
  </aside>

  <!-- ── Contenido ──────────────────────────────────────── -->
  <div class="content">
    <header class="topbar">
      <div class="tb-title">
        <h1 id="pageTitle"></h1>
        <p id="pageSub"></p>
      </div>
      <div class="tb-tools">
        <div class="exp-group" id="expGroup">
          <button class="btn btn-ghost" id="btnPdf" onclick="Exporter.run('pdf')"><svg viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 14h6M9 17h4"/></svg><span>PDF</span></button>
          <button class="btn btn-ghost" id="btnXls" onclick="Exporter.run('xlsx')"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M4 9h16M4 15h16M10 3v18"/></svg><span>Excel</span></button>
          <button class="btn btn-ghost" id="btnPrt" onclick="Exporter.run('print')"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg><span data-i18n="print"></span></button>
        </div>
        <select class="sel" id="langSel" onchange="App.setLang(this.value)" aria-label="Idioma">
          <option value="es">Español</option>
          <option value="en">English</option>
          <option value="pap">Papiamentu</option>
          <option value="nl">Nederlands</option>
        </select>
        <button class="icon-btn" id="themeBtn" onclick="App.toggleTheme()" aria-label="Tema">
          <svg viewBox="0 0 24 24" class="i-moon"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
          <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="main">
      <section id="mod-inicio"   class="mod"></section>
      <section id="mod-tareas"   class="mod"></section>
      <section id="mod-reportes" class="mod"></section>
      <section id="mod-caja"     class="mod"></section>
      <section id="mod-calc"     class="mod"></section>
      <section id="mod-productos" class="mod"></section>
      <section id="mod-empresa"  class="mod"></section>
    </main>
  </div>
</div>

<!-- Modal de confirmación y avisos -->
<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <p id="modalTxt"></p>
    <div class="modal-act">
      <button class="btn btn-ghost" id="modalNo"></button>
      <button class="btn btn-danger" id="modalYes"></button>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script src="/vendor/jspdf.js" defer></script>
<script src="/vendor/autotable.js" defer></script>
<script src="/vendor/exceljs.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/core.js" defer></script>
<script src="js/billetes.js" defer></script>
<script src="js/export.js" defer></script>
<script src="js/inicio.js" defer></script>
<script src="js/tareas.js" defer></script>
<script src="js/caja.js" defer></script>
<script src="js/calc.js" defer></script>
<script src="js/productos.js" defer></script>
<script src="js/empresa.js" defer></script>
<script src="js/boot.js" defer></script>
</body>
</html>
